[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exceptionos"
version = "0.2.0"
description = "Deterministic payment reconciliation engine and CLI — match transactions across processors, gateways, and your ledger."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic"
]
license = { text = "MIT" }
authors = [{ name = "Kandadi Charan Tej", email = "kandadicharantej21@gmail.com" }]
keywords = ["payments", "fintech", "reconciliation", "ledger", "accounting", "stripe", "finance", "settlement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KandadiCharanTej/ExceptionOS"
Source = "https://github.com/KandadiCharanTej/ExceptionOS"
Issues = "https://github.com/KandadiCharanTej/ExceptionOS/issues"

[project.scripts]
exceptionos = "exceptionos.cli:main"
exceptionos-generate = "exceptionos.data_generator.generator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exceptionos"]
